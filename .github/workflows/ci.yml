name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP ${{ matrix.php }} — Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pcntl, mbstring, gd, xml, dom, xmlwriter, redis
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: service/vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('service/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Validate composer.json
        working-directory: service
        run: composer validate --strict

      - name: Install dependencies
        working-directory: service
        run: composer install --no-interaction

      - name: Composer Security Audit
        working-directory: service
        run: composer audit --no-dev

      - name: PHP Syntax Check
        working-directory: service
        run: find app -name '*.php' -exec php -l {} \; | grep -v 'No syntax errors'

      - name: PHPStan Static Analysis
        continue-on-error: true
        working-directory: service
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP CS Fixer (dry-run)
        working-directory: service
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPUnit Tests
        working-directory: service
        run: php vendor/bin/phpunit --testdox
