name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP ${{ matrix.php }} — Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 项目要求 PHP 8.3+（CLAUDE.md）；phpunit ^12.5 亦要求 PHP >= 8.3，
        # 8.2 无法安装 dev 依赖，故矩阵从 8.3 起
        php: ['8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # coverage: pcov —— 用 pcov 作为覆盖率采集驱动（比 xdebug 快），
          # 同时不安装默认的 xdebug。若改用 xdebug：去掉该行并把下方采集步骤
          # 换成 XDEBUG_MODE=coverage vendor/bin/phpunit ...
          coverage: pcov
          # bcmath/gmp：HashidsServiceTest 依赖（缺任一扩展即失败，曾致 phpunit exit 2）
          extensions: pdo, pdo_mysql, pcntl, mbstring, gd, xml, dom, xmlwriter, redis, bcmath, gmp
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Composer Security Audit
        run: composer audit --no-dev

      - name: PHP Syntax Check
        # 注意：不能写成 `find ... | grep -v ...`（全部通过时 grep 无输出 → exit 1，
        # GitHub Actions 默认 pipefail 下步骤会误报失败）。if 判定：有错误行 → 失败。
        run: |
          if find app -name '*.php' -exec php -l {} \; 2>&1 | grep -v 'No syntax errors'; then
            exit 1
          fi

      - name: Create .env from example
        run: cp .env.example .env

      # C1 强校验拒绝 CHANGE_ME_ 占位值启动，CI 需模拟真实部署生成随机密钥
      - name: Generate random secrets for placeholder check
        run: |
          sed -i -E "s/CHANGE_ME_[0-9a-f]+/$(openssl rand -hex 16)/g" .env
          # DB_PASSWORD 置空：本 job 的 mysql service 为 root 空口令（与 e2e job 同款处理），
          # 不置空则 app config 连接（CrmModuleTest/CrmServiceTest 分析报表走此路径）必 1045 access denied
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/' .env

      - name: PHPStan Static Analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # 遗留#2：集成测试由 TEST_DB_* 驱动（tests/Integration/IntegrationTestCase.php），
      # 缺表会连接成功但查询失败 —— 先导入全量 install.sql（163 张表 + 全部种子）再跑。
      - name: Initialize database (full seed for integration tests)
        run: mysql -h 127.0.0.1 -u root erp < database/install.sql

      - name: PHPUnit Tests
        # --no-coverage：普通测试步骤不做覆盖率采集（phpunit.xml 已配置报告输出，
        # 不关闭的话每轮都会重复采集+生成 HTML），覆盖率由下方专门步骤负责。
        # 失败时把输出尾部（含失败测试名与 Tests 总结）写入 ::error:: 注解，
        # 便于匿名定位 CI 特有失败（本地/CI 扩展差异曾致 Hashids 测试 exit 2）。
        # 注意：GH Actions 默认 bash -e，命令替换内失败会直接终止步骤 —— set +e 包住。
        run: |
          set +e
          out="$(php vendor/bin/phpunit --no-coverage 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            echo "::error::$(printf '%s' "$out" | tail -35 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            exit $code
          fi
        # 遗留#2：与 e2e job 的 mysql/redis 服务一致，跑起集成测试（缺则 markTestSkipped 跳过）
        # 注：.env 的 DB_PASSWORD 已在 Generate random secrets 步骤置空，
        # 使走 app config 的模块测试（CrmModuleTest 分析报表等）能连上 mysql 服务
        env:
          TEST_DB_DATABASE: erp
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ""
          TEST_REDIS_HOST: 127.0.0.1

      - name: PHPUnit Coverage Collection (pcov)
        # 采集驱动：CI 已通过 setup-php coverage: pcov 安装 pcov。
        # pcov.* 为 PHP_INI_SYSTEM，只能经 -d 在进程启动时设置；
        # pcov.directory 指向仓库根，报告范围由 phpunit.xml 的 <source> 过滤。
        # 若改用 xdebug：删除 -d 参数并设 env: XDEBUG_MODE: coverage。
        # 注意：pcov 驱动缺失时 phpunit 会打印 "No code coverage driver available"
        # 并以 exit 0 结束且不写 clover.xml（曾致 gate 报"找不到 clover.xml" exit 2
        # 难归因）—— 下面显式检查 clover 是否生成，缺失即红并注解。
        run: |
          mkdir -p runtime/coverage
          php -d pcov.enabled=1 -d pcov.directory="$PWD" vendor/bin/phpunit \
            --coverage-clover runtime/coverage/clover.xml \
            --coverage-html runtime/coverage/html
          if [ ! -s runtime/coverage/clover.xml ]; then
            echo "::error::coverage 未生成 clover.xml（pcov 驱动缺失？）—— 检查 Setup PHP 步骤"
            exit 1
          fi
        env:
          XDEBUG_MODE: coverage
          # 与 PHPUnit Tests 步骤一致，覆盖率采集同样纳入集成测试
          TEST_DB_DATABASE: erp
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ""
          TEST_REDIS_HOST: 127.0.0.1

      - name: Coverage Threshold Gate
        # 渐进门槛（当前基线）：整体 ≥4%，业务层 app/service ≥10%，不达标即红。
        # 目标门槛：整体 ≥30%，业务层 ≥40%（见 docs/superpowers/plans/2026-08-07-next-phase-plan.md P1-B4），
        # 随测试补充逐步收紧——每轮合入前将阈值上调至略低于实测值，直至达到目标，防止覆盖率回退。
        # 注：当前实测 4.78%/10.61%（新增测试多为校验/契约类，对 controller 成功路径覆盖有限，属正常起步值）。
        # 失败时输出经 ::error:: 写入 check-run annotations（API 匿名可读）便于定位
        # （"找不到 clover.xml" 需回头查上一步 Coverage Collection）。
        run: |
          set +e
          out="$(php scripts/check-coverage.php \
            --clover=runtime/coverage/clover.xml \
            --threshold=4 \
            --business-dir=service \
            --business-threshold=10 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            echo "::error::$(printf '%s' "$out" | tail -15 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            exit $code
          fi

  # ============================================================
  # Flutter 前端 CI（E1）
  # ------------------------------------------------------------
  # 独立于 PHP job，互不影响。步骤：安装 Flutter stable → pub get →
  # analyze → test（打包步骤已按需求取消：推送后不再构建 web 产物）。
  # 说明：当前以 continue-on-error: true 接入（不阻断主 CI），
  # 待 GitHub Actions 环境装 Flutter / 构建耗时稳定后，移除该行收紧为硬性检查。
  flutter:
    name: Flutter — Analyze & Test
    runs-on: ubuntu-latest
    continue-on-error: true # 待环境稳定后收紧（见上方注释）
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        # 曾在 CI 连续失败（本地成功）；失败输出经 ::error:: 写入
        # check-run annotations（API 匿名可读）便于定位。
        # pub.dev 网络抖动（Resolving dependencies 阶段超时）：shell 重试 3 次。
        # 注意：GH Actions 默认 bash -e，命令替换内失败会直接终止步骤，
        # ::error:: 不会执行 —— 用 set +e 包住捕获行。
        run: |
          set +e
          out=""
          for i in 1 2 3; do
            out="$(flutter pub get 2>&1)"
            code=$?
            [ $code -eq 0 ] && break
            echo "pub get attempt $i failed (exit $code), retrying..."
            sleep 5
          done
          set -e
          set -e
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            echo "::error::$(printf '%s' "$out" | tail -25 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            exit $code
          fi

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Flutter Tests
        run: flutter test

  # ============================================================
  # 文档校验（D5）：统计数字与代码事实一致性
  # ------------------------------------------------------------
  # 运行 scripts/doc-stats.sh --check：
  #   1) 实时采集代码统计（控制器/服务/模型/中间件/表/模块/测试数等）；
  #   2) 扫描 docs/**/*.md 中 <!-- stats:key=value --> 注释标注并逐键比对；
  #   3) 文档数字与代码事实漂移即红（文档数据治理 D2/D3/D4/D5）。
  # 注意：doc-stats 需要 phpunit 输出（vendor/bin/phpunit --no-coverage），
  #       故本作业先安装依赖并创建 .env，由脚本内部执行 phpunit 取真实值。
  # 本地等价命令：bash scripts/doc-stats.sh --check
  # ============================================================
  docs:
    name: Docs — 统计数字一致性校验 (doc-stats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # 与 php job 保持同一扩展集（bcmath/gmp 供 Hashids 测试，缺则断言数漂移）
          extensions: pdo, pdo_mysql, pcntl, mbstring, gd, xml, dom, xmlwriter, redis, bcmath, gmp
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Create .env from example
        run: cp .env.example .env

      - name: Generate random secrets for placeholder check
        run: sed -i -E "s/CHANGE_ME_[0-9a-f]+/$(openssl rand -hex 16)/g" .env

      - name: Docs stats check
        # 单元测试无需 MySQL/Redis：集成用例在缺少 TEST_DB_* / TEST_REDIS_* 时
        # 会 markTestSkipped 优雅跳过，跳过用例仍计入 tests 总数，不影响比对。
        # 失败时输出经 ::error:: 写入 check-run annotations（API 匿名可读），
        # 便于定位 CI/本地环境差异（本地 18/18 通过、CI 曾确定性红）。
        # 注意：GH Actions 默认 bash -e，命令替换内脚本失败会直接终止步骤
        # （printf / ::error:: 均不执行）—— 必须 set +e 包住捕获行。
        run: |
          mkdir -p runtime
          set +e
          out="$(bash scripts/doc-stats.sh --check 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            echo "::error::$(printf '%s' "$out" | tail -15 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            exit $code
          fi

  # ============================================================
  # E2E 冒烟测试：真实 HTTP 走通核心链路
  # ------------------------------------------------------------
  # 用途: 走通健康检查/登录/JWT/RBAC/CRUD/刷新令牌 10 条链路
  # 运行: php tests/E2E/smoke.php [--base-url=...] [--list]
  #       需要服务已启动（php start.php start -d）且数据库有测试账号。
  # 数据库初始化: 全量种子 database/install.sql（163 张表）+ 手工 INSERT 测试账号（admin/admin123）
  #   并绑定 super_admin 角色（role_id=10000000000000001，见 install.sql 种子）。
  # 参数名约定: 已核对 UserController::show/update/destroy 形参为 string $id，
  #   与 webman resource 路由生成的 {id} 匹配，无需适配（早期注释里的
  #   $hashid 顾虑已过时）。id 经 encodeIds/decodeId 做 hashid 往返，链路自洽。
  # 端口: config/process.php 监听 8788，smoke 与健康检查均用 8788。
  # 本地验证命令（与本 job 等价）:
  #   mysql -h 127.0.0.1 -u root erp < database/install.sql
  #   php start.php start -d
  #   E2E_USER=admin E2E_PASS=admin123 php tests/E2E/smoke.php --base-url=http://127.0.0.1:8788
  # ============================================================
  e2e:
    name: E2E Smoke — HTTP 核心链路
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # 与 php job 保持同一扩展集（bcmath/gmp 供 Hashids 依赖，缺任一即失败）
          extensions: pdo, pdo_mysql, pcntl, mbstring, gd, xml, dom, xmlwriter, redis, bcmath, gmp
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Create .env from example
        run: cp .env.example .env

      # C1 强校验拒绝 CHANGE_ME_ 占位值启动，CI 需模拟真实部署生成随机密钥
      # （与 php job 的 sed 做法一致，避免为每个 CHANGE_ME_ 单独写一条替换）
      - name: Generate random secrets for placeholder check
        run: sed -i -E "s/CHANGE_ME_[0-9a-f]+/$(openssl rand -hex 16)/g" .env

      - name: Initialize database (full seed + test account)
        # 遗留#2：已由最小种子升级为全量 database/install.sql（163 张表 + 全部种子），
        # 让 api-coverage 全模块遍历真正覆盖（最小种子缺业务表会 SKIP）。
        # install.sql 可一条 mysql 命令完整导入（跨 migration 重复权限 ID 与
        # NULL 缺陷已于 2026-08-26 修复，本地验证命令见本 job 头注释）。
        # 测试账号 bcrypt 哈希在 CI 运行时生成，避免仓库内提交固定哈希。
        run: |
          mysql -h 127.0.0.1 -u root erp < database/install.sql
          HASH=$(php -r "echo password_hash('admin123', PASSWORD_BCRYPT);")
          mysql -h 127.0.0.1 -u root erp -e "
            INSERT INTO erp_admin_user (id, username, password, real_name, status)
            VALUES (90000000000000001, 'admin', '$HASH', 'E2E Admin', 1);
            INSERT INTO erp_admin_user_role (user_id, role_id)
            VALUES (90000000000000001, 10000000000000001);"

      - name: Start webman service
        # 端口与 config/process.php 的 listen（8788）保持一致
        # SCOUT_DRIVER=null：CI 不安装 ES 客户端包（composer 未引入 elasticsearch/elasticsearch），
        # 而登录路径会 save 用户模型触发 Searchable trait 同步 —— 默认 elasticsearch 驱动下
        # EngineManager 直接抛异常致登录 500。E2E 不测搜索，切 null 驱动（webman-scout 文档化禁用开关）。
        # DB_PASSWORD 置空：Generate random secrets 会把 .env.example 的 CHANGE_ME_ 口令替换为
        # 随机 hex，而 CI MySQL 是 MYSQL_ALLOW_EMPTY_PASSWORD（root 空口令）—— 不置空则
        # webman 带随机密码连接必 Access denied（health 仍 200，db=unavailable，登录 500）。
        # 开发环境 env_secret 允许空口令（env_is_production() 门控），此改动仅影响 E2E 场景。
        # E2E_CAPTCHA_CODE：AuthController 的 E2E 旁路口令（登录时 captcha_key 与之相等则跳过点击验证），
        # 验证码目标坐标属服务端秘密，E2E 脚本无法自行求解，故由 CI 注入测试口令。
        run: |
          sed -i 's/^SCOUT_DRIVER=elasticsearch/SCOUT_DRIVER=null/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/' .env
          echo 'E2E_CAPTCHA_CODE=e2e-test-code' >> .env
          php start.php start -d

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8788/health > /dev/null 2>&1; then
              echo "health OK"; exit 0
            fi
            sleep 1
          done
          echo "service not healthy"; exit 1

      - name: Run E2E smoke
        run: php tests/E2E/smoke.php --base-url=http://127.0.0.1:8788
        env:
          E2E_USER: admin
          E2E_PASS: admin123 # 与 Initialize database 步骤插入的测试账号一致
          E2E_CAPTCHA_CODE: e2e-test-code # 与 Start webman service 写入服务端 .env 的口令一致

      - name: Run E2E API coverage
        # 遗留#2：api-coverage 全模块只读遍历（25 业务模块 + 系统管理，全读操作）。
        # 已升级全量种子，业务表齐全应全绿；脚本以 FAIL>0 定退出码，SKIP 不失败。
        run: php tests/E2E/api-coverage.php --base-url=http://127.0.0.1:8788
        env:
          E2E_USER: admin
          E2E_PASS: admin123 # 与 Initialize database 步骤插入的测试账号一致
          E2E_CAPTCHA_CODE: e2e-test-code # 与 Start webman service 写入服务端 .env 的口令一致

  # ============================================================
  # 版本增量发布（推送规则）
  # ------------------------------------------------------------
  # push 到 main 且 php/docs/e2e 全部通过后，按最新 tag patch+1 创建
  # 新版本 tag（v1.1.4 → v1.1.5）并推送。PR 不触发（if 限定 push）。
  # tag push 不匹配 on.push.branches: [main]，不会递归触发本 workflow。
  # 远端已存在同名 tag（并发 CI / 手动已打）时脚本自动跳过，幂等。
  # 本地预览：bash scripts/bump-version.sh --check
  # ============================================================
  release:
    name: Release — 版本增量 tag
    runs-on: ubuntu-latest
    needs: [php, docs, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆不带历史 tag，必须全量拉取才能读到最新版本
          fetch-depth: 0
      - name: Create version tag
        # CI runner 无 git 身份配置，annotated tag（git tag -a）需要 committer
        # 身份 —— 缺失时 git 报 "不允许空的姓名" 并以 exit 128 失败（曾致
        # release job 仅显示 "Process completed with exit code 128" 难归因），
        # 故先设置 github-actions bot 身份再执行。
        # 失败时输出经 ::error:: 写入 check-run annotations 便于定位。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          out="$(bash scripts/bump-version.sh --create 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            echo "::error::$(printf '%s' "$out" | tail -15 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            exit $code
          fi
      - name: Create GitHub Release
        # 推送规则：tag 创建后按同一最新版本增量创建 GitHub Release。
        # 幂等：bump-version.sh 跳过已存在 tag 时 release 通常也已存在 → 跳过；
        # 并发/手动先建了 release → gh release view 命中 → 跳过，不会报错。
        # gh 用自动 token（permissions: contents: write 已声明）。
        run: |
          NEW="$(bash scripts/bump-version.sh --create 2>&1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | tail -1)"
          if [ -n "$NEW" ] && ! gh release view "$NEW" >/dev/null 2>&1; then
            gh release create "$NEW" --generate-notes
          fi
