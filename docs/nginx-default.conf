# ============================================================
# Nginx 站点配置（server 块，挂载到 /etc/nginx/conf.d/default.conf）
# 反向代理到 webman 应用容器（app:8788）
# 限流 zone 定义见 nginx-rate-limit.conf（http 上下文）
# ============================================================
server {
    listen 80;
    server_name _;

    # --- 请求体大小限制（与后端 SecurityFilter 10MB 一致） ---
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # --- 全局限流（zone 定义见 nginx-rate-limit.conf） ---
    limit_req zone=api burst=10 nodelay;
    limit_conn perip 20;

    # --- 安全头（不依赖额外模块） ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- 静态文件 ---
    root /app/public;

    # --- 禁止访问敏感文件 ---
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(?:sql|log|env|yml|yaml|bak|swp|old|dist)$ {
        deny all;
        return 404;
    }

    # --- 登录端点额外限流 ---
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://app:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # --- 反向代理到 webman ---
    location / {
        proxy_pass http://app:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # --- Gzip 压缩 ---
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
