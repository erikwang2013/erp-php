<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- 低风险 CSP：config.js/LOAD_SCRIPTS 是运行时动态注入的脚本，故不限制 script-src -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
    />
    <link rel="icon" href="./favicon.ico" />
    <title>Apidoc</title>
  </head>
  <body >
    <div id="app"></div>
    <%- injectScript %>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
